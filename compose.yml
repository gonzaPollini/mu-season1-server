# OpenMU 0.9.10 local (la versión que usa el instalador de OpenMu-Client-Babylon).
# Juego publicado en la LAN (192.168.0.253) y en localhost; panel de admin sólo en http://localhost:8081
name: openmu-local
services:
  openmu-startup:
    # OpenMU 0.9.10 + plugins propios (plugins/, Dockerfile). Recompilar: docker compose up -d --build
    image: season1-openmu:local
    build: .
    container_name: openmu-startup
    ports:
      - "127.0.0.1:8081:8080"
      - "192.168.0.253:44405:44405"
      - "127.0.0.1:44405:44405"
      - "192.168.0.253:44406:44406"
      - "127.0.0.1:44406:44406"
      - "192.168.0.253:55901-55906:55901-55906"
      - "127.0.0.1:55980:55980"
    environment:
      DB_HOST: database
      ASPNETCORE_URLS: http://+:8080
      RESOLVE_IP: 192.168.0.253   # IP de la notebook en la LAN: la usan MuMain (Windows) y el proxy del navegador
    working_dir: /app/
    depends_on: [database]
  database:
    image: postgres:16
    container_name: openmu-db
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: openmu
      POSTGRES_USER: postgres
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
